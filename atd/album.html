<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アルバム - サッカー同好会</title>
    <link rel="stylesheet" href="style.css?v=20260306_2">
    <style>
        .reactions {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
            font-size: 0.85rem;
            flex-wrap: wrap;
        }

        .reaction {
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 8px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
            user-select: none;
            color: #64748b;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .reaction:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .reaction.active {
            background: #e0f2fe;
            border-color: #7dd3fc;
            color: #0369a1;
            font-weight: bold;
        }

        .member-select-card {
            background: #f8fafc;
            border-left: 4px solid #3b82f6;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>

<body>
    <div id="loading-overlay" style="display:none;">処理中...</div>

    <div class="container">
        <header>
            <h1>📸 アルバム</h1>
            <div style="margin-top: 1rem;">
                <a href="../index.html" class="btn btn-secondary btn-sm"
                    style="display: inline-block; width: auto; text-decoration: none;">🏠 戻る</a>
            </div>
        </header>

        <!-- Album Auth Area -->
        <div id="album-auth-area" class="card mt-2" style="max-width: 400px; margin: 2rem auto;">
            <h2 style="text-align: center; font-size: 1.25rem; margin-bottom: 1rem;">🔐 パスワードが必要です</h2>
            <div class="form-group">
                <input type="password" id="album-password" placeholder="パスワードを入力">
            </div>
            <button onclick="checkAlbumPassword()" class="btn">認証する</button>
        </div>

        <!-- Main Content Area (Hidden by default) -->
        <div id="album-main-content" style="display: none;">
            <div class="tabs">
                <button id="tab-view-btn" class="tab-btn active" onclick="switchAlbumTab('view')">写真閲覧</button>
                <button id="tab-upload-btn" class="tab-btn" onclick="switchAlbumTab('upload')">写真アップロード</button>
            </div>

            <!-- View Tab -->
            <div id="album-view" class="tab-content active">
                <div class="card">
                    <div class="form-group">
                        <label for="view-period-select">1. 期間を選択</label>
                        <select id="view-period-select">
                            <option value="">-- 期間を選択 --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="view-event-select">2. イベントを選択</label>
                        <select id="view-event-select" disabled>
                            <option value="">-- 先に期間を選択してください --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="view-member-select">3. あなたの名前を選択（必須）</label>
                        <select id="view-member-select" class="member-select-sync">
                            <option value="">-- 名前を選択 --</option>
                        </select>
                        <p class="text-muted" style="font-size: 0.75rem; margin-top: 4px;">※リアクションやコメントに必要です。</p>
                    </div>
                </div>
                <div id="photo-grid" class="photo-grid">
                    <!-- Photos will be rendered here -->
                </div>
            </div>

            <!-- Upload Tab -->
            <div id="album-upload" class="tab-content">
                <div class="card">
                    <div class="form-group">
                        <label for="upload-period-select">1. 期間を選択</label>
                        <select id="upload-period-select">
                            <option value="">-- 期間を選択 --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="upload-event-select">2. アップロード先イベント</label>
                        <select id="upload-event-select" disabled>
                            <option value="">-- 先に期間を選択してください --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="upload-member-select">3. あなたの名前を選択（必須）</label>
                        <select id="upload-member-select" class="member-select-sync">
                            <option value="">-- 名前を選択 --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="photo-input">4. 写真を選択 (複数枚可)</label>
                        <input type="file" id="photo-input" accept="image/*" multiple>
                    </div>
                    <button id="upload-btn" class="btn">アップロード開始</button>
                </div>
                <div id="upload-status" class="item-meta" style="margin-top: 1rem; text-align: center;"></div>
            </div>
        </div>

        <div id="photo-modal" class="modal">
            <div class="modal-content photo-modal-content">
                <div class="modal-header">
                    <button class="btn-close" onclick="closePhotoModal()">×</button>
                </div>
                <div class="modal-body">
                    <div class="modal-photo-section">
                        <div class="modal-photo-container">
                            <img id="modal-img" src="" alt="拡大写真">
                        </div>
                        <div id="modal-photo-reactions" class="reactions photo-reactions-bar">
                            <!-- Photo reactions will be rendered here -->
                        </div>
                    </div>
                    <div class="modal-comment-container">
                        <h3>💬 コメント</h3>
                        <div id="comment-list" class="comment-list">
                            <!-- コメントがここに読み込まれます -->
                            <p class="text-muted" style="text-align: center; padding: 1rem;">読み込み中...</p>
                        </div>
                        <div class="comment-form">
                            <div class="inline-form mt-1">
                                <input type="text" id="comment-text" placeholder="コメントを入力...">
                                <button onclick="saveComment()" class="btn btn-sm" style="width: 60px;">送信</button>
                            </div>
                            <p id="modal-member-status" class="text-muted"
                                style="font-size: 0.75rem; margin-top: 4px; display: none; color: #ef4444;">※名前を選択してください
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="album.js?v=20260306_10"></script>
</body>

</html>
